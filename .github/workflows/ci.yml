# Runs the automated checks on every push and pull request.
#
# This replaced a GitHub Pages deploy workflow that failed on every single push,
# because Pages was never switched on for this repository. The live site is
# hosted on Vercel, which deploys on its own, so nothing here needs to publish
# anything — it only needs to check the code is sound.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Playwright's browser is needed by the two browser stages of `verify`.
      - name: Install dependencies
        run: npm ci || npm install

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start the local server
        run: npm start &

      # One command, one verdict. It runs the unit and source checks, the button
      # wiring, the CRM in a real browser (online and offline), the public site
      # and the guide in a real browser with an axe-core accessibility scan, and
      # finally the live deployment. A stage it cannot run is reported as a
      # failure rather than skipped quietly — that silent-skip behaviour is what
      # produced every false "verified" claim in this project's history.
      - name: Verify
        run: npm run verify
