# Runs the automated checks on every push and pull request.
#
# This replaced a GitHub Pages deploy workflow that failed on every single push,
# because Pages was never switched on for this repository. The live site is
# hosted on Vercel, which deploys on its own, so nothing here needs to publish
# anything — it only needs to check the code is sound.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright's browser is needed by the browser stages of `verify`.
      - name: Install dependencies
        run: npm ci || npm install

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start the local server
        run: npm start &

      # The NBO archetype contract is deliberately separate from the historical
      # OTTO source tests so this architectural change has a clear red/green gate.
      - name: Verify NBO hybrid local contract
        run: node scripts/test-nbo-hybrid-local.mjs

      # On a pull request, everything except the live stage. The live stage
      # checks production for changes this pull request has not deployed yet —
      # that the working documents have stopped being published, for instance —
      # so gating a pull request on it fails by construction. VERIFY_SKIP_LIVE
      # makes that stage exit 3, which the aggregator reports as SKIPPED and
      # refuses to count as a pass, so the verdict here is honest about what it
      # did and did not check.
      - name: Verify (source, app, and site)
        if: github.event_name == 'pull_request'
        env:
          QA_VISUAL_DIR: ${{ github.workspace }}/qa-visual-artifacts
        run: npm run verify -- --no-live

      # On main, after Vercel has had a chance to deploy the merge, the live
      # stage runs too. A stage it cannot run is reported as a failure rather
      # than skipped quietly — that silent skip is what produced every false
      # "verified" claim in this project's history.
      - name: Wait for the deploy to land
        if: github.event_name != 'pull_request'
        run: sleep 90

      - name: Verify (everything, including the live deployment)
        if: github.event_name != 'pull_request'
        env:
          QA_VISUAL_DIR: ${{ github.workspace }}/qa-visual-artifacts
        run: npm run verify

      # Keep the visual proof instead of throwing it away with the runner.
      # The Playwright visual suite captures the screens it checks and verifies
      # that Font Awesome glyphs really render rather than merely reporting a
      # font-family name. `if: always()` preserves whatever evidence exists even
      # when a later check fails.
      - name: Upload visual QA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otto-visual-qa-${{ github.run_number }}
          path: qa-visual-artifacts/
          if-no-files-found: warn
          retention-days: 30
