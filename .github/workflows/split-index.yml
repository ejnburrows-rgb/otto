name: split-index
on:
  push:
    branches: ["agent/split-index"]
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split index.html into small base64 parts
        run: |
          mkdir -p parts
          gzip -9 -c index.html | base64 > /tmp/index.gz.b64
          split -b 48000 -d -a 2 /tmp/index.gz.b64 parts/part_ --additional-suffix=.txt
          git hash-object index.html > parts/blob_sha.txt
          wc -c index.html /tmp/index.gz.b64 parts/*.txt > parts/manifest.txt
      - name: Commit parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add parts
          git commit -m "chore: split index.html for chunked retrieval [skip ci]"
          git push
